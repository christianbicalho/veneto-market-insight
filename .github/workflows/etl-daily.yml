name: ETL diário de indicadores

on:
  schedule:
    # 22:00 UTC (19:00 em Brasília) — após o fechamento do pregão e da PTAX
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  atualizar-base:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar ETL incremental
        run: python etl/pipeline.py --incremental

      - name: Commitar base atualizada
        run: |
          git config user.name "veneto-etl-bot"
          git config user.email "actions@github.com"
          git add data/curated src/data/dashboard.json
          git diff --staged --quiet || git commit -m "chore(etl): atualização diária da base"
          git push
